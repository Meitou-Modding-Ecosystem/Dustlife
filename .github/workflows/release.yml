# Releases the mod: a tag <slug>-v<version> on release builds it, checks the version against its meitou.json, and publishes
# <MOD_FOLDER>-<version>.zip (with its SHA-256) holding the folder to drop into Kenshi/mods/. Packaging: GutenStructure
# package-meitou-mod.yml (pinned). Dustlife: tag dustlife-v<version>.
name: Release

on:
  push:
    tags: ["dustlife-v*"]

permissions:
  contents: read

jobs:
  release-gate:
    permissions:
      contents: read
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/release-gate.yml@35828a0aa8752f1fc56a9dbdd35b330bf3520ab2

  release:
    needs: release-gate
    permissions:
      contents: write
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/package-meitou-mod.yml@35828a0aa8752f1fc56a9dbdd35b330bf3520ab2
    with:
      mod-folder: Dustlife
      slug: dustlife
      channel: release
      test-project: .
      # true for a code mod without data: the zip gets an empty Dustlife.mod. false when <Mod>.Data generates one.
      empty-data-mod: true
